{% extends 'base.html' %}
{% block titre %}Authentification{% endblock %}
{% block contenu %}
<h1>Connexion</h1>
{% if error %}
    <p role="alert">Identifiant ou mot de passe incorrect.</p>
{% endif %}
<form action="{{ url_for('authentification') }}" method="post">
    <label for="username">Nom d'utilisateur:</label><br>
    <input type="text" id="username" name="username" autocomplete="username" required><br>
    <label for="password">Mot de passe:</label><br>
    <input type="password" id="password" name="password" autocomplete="current-password" required><br><br>
    <input type="submit" value="Se connecter">
</form>
{% endblock %}
